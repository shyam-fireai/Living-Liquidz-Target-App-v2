# Theme: FireAI palette (fireai.in) with Living Liquidz branding. Colours used in custom HTML/CSS
# live in ui/branding.py - keep the two in sync.
[theme]
base = "light"
primaryColor = "#1068E8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#0A0A0A"
linkColor = "#1068E8"
borderColor = "#E5E5E5"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
headingFont = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
baseRadius = "0.625rem"
showWidgetBorder = true
showSidebarBorder = false
dataframeHeaderBackgroundColor = "#F5F5F5"

[theme.sidebar]
backgroundColor = "#030716"
secondaryBackgroundColor = "#0A1230"
textColor = "#E7E9ED"
borderColor = "#24304F"
primaryColor = "#2B7EFF"

[client]
toolbarMode = "minimal"

[server]
# Don't watch source files for changes. Watching made the first visit to a screen (e.g. Edit)
# take 1-4 s while Streamlit scanned every loaded module, and a server should not reload on
# file changes anyway. During development, restart the app after editing code (or run with
# `streamlit run app.py --server.fileWatcherType auto` to get auto-reload back).
fileWatcherType = "none"
